<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NASA Research Mindmap - Advanced Viewer</title>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      mermaid.initialize({ 
        startOnLoad: false,
        theme: 'default',
        mindmap: {
          padding: 20,
          maxNodeWidth: 200,
        }
      });

      async function generateMindmap() {
        const pmc = document.getElementById("pmc").value.trim();
        const mode = document.getElementById("mode").value;

        if (!pmc) {
          showError("Enter PMC ID");
          return;
        }

        showLoading();
        const mindmapBox = document.getElementById("mindmap");
        const detailsBox = document.getElementById("research-details");

        try {
          // Fetch mindmap
          console.log(`Fetching mindmap for ${pmc} in ${mode} mode...`);
          const mindmapRes = await fetch(
            `http://127.0.0.1:8000/articles/${pmc}/mindmap?mode=${mode}`
          );
          
          if (!mindmapRes.ok) {
            const errorData = await mindmapRes.json().catch(() => ({}));
            throw new Error(errorData.detail || `API error: ${mindmapRes.status}`);
          }

          const mindmapData = await mindmapRes.json();
          console.log("Mindmap data received:", mindmapData);

          // Render mindmap
          mindmapBox.innerHTML = "";
          const el = document.createElement("div");
          el.className = "mermaid";
          el.textContent = mindmapData.mindmap;
          mindmapBox.appendChild(el);

          try {
            await mermaid.run();
            console.log("Mindmap rendered successfully");
          } catch (mermaidError) {
            console.error("Mermaid rendering error:", mermaidError);
            showError(`Mindmap rendering error: ${mermaidError.message}`);
            return;
          }

          // If research mode, fetch detailed data
          if (mode === "research") {
            try {
              const dataRes = await fetch(
                `http://127.0.0.1:8000/articles/${pmc}/research-data`
              );
              if (dataRes.ok) {
                const researchData = await dataRes.json();
                displayResearchDetails(researchData.research_data, detailsBox);
              }
            } catch (e) {
              console.warn("Could not fetch detailed research data", e);
            }
          } else {
            detailsBox.innerHTML = "";
          }

          hideLoading();
        } catch (e) {
          console.error("Error:", e);
          showError(`Error: ${e.message}`);
        }
      }

      function displayResearchDetails(data, container) {
        let html = '<div class="research-details">';

        if (data.research_question) {
          html += `
            <div class="detail-section">
              <h3>🎯 Research Question</h3>
              <p>${escapeHtml(data.research_question)}</p>
            </div>
          `;
        }

        if (data.sample_details) {
          html += `
            <div class="detail-section">
              <h3>👥 Sample Details</h3>
              <p>${escapeHtml(data.sample_details)}</p>
            </div>
          `;
        }

        if (data.methodology && data.methodology.length) {
          html += `
            <div class="detail-section">
              <h3>🔬 Methodology</h3>
              <ul>
                ${data.methodology.map(m => `<li>${escapeHtml(m)}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (data.key_findings && data.key_findings.length) {
          html += `
            <div class="detail-section highlight">
              <h3>✅ Key Findings</h3>
              <ul>
                ${data.key_findings.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (data.statistical_significance) {
          html += `
            <div class="detail-section">
              <h3>📊 Statistical Significance</h3>
              <p><code>${escapeHtml(data.statistical_significance)}</code></p>
            </div>
          `;
        }

        if (data.mechanisms && data.mechanisms.length) {
          html += `
            <div class="detail-section">
              <h3>⚙️ Mechanisms</h3>
              <ul>
                ${data.mechanisms.map(m => `<li>${escapeHtml(m)}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (data.implications && data.implications.length) {
          html += `
            <div class="detail-section">
              <h3>💡 Implications</h3>
              <ul>
                ${data.implications.map(i => `<li>${escapeHtml(i)}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (data.limitations && data.limitations.length) {
          html += `
            <div class="detail-section warning">
              <h3>⚠️ Limitations</h3>
              <ul>
                ${data.limitations.map(l => `<li>${escapeHtml(l)}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (data.open_questions && data.open_questions.length) {
          html += `
            <div class="detail-section">
              <h3>❓ Open Questions for Future Research</h3>
              <ul>
                ${data.open_questions.map(q => `<li>${escapeHtml(q)}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (data.relevant_fields && data.relevant_fields.length) {
          html += `
            <div class="detail-section">
              <h3>🏷️ Related Fields</h3>
              <div class="tags">
                ${data.relevant_fields.map(f => `<span class="tag">${escapeHtml(f)}</span>`).join('')}
              </div>
            </div>
          `;
        }

        html += '</div>';
        container.innerHTML = html;
      }

      function escapeHtml(text) {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
      }

      function showLoading() {
        document.getElementById("mindmap").innerHTML = "<p class='loading'>⏳ Generating mindmap...</p>";
        document.getElementById("research-details").innerHTML = "";
      }

      function hideLoading() {
        const loadingEl = document.querySelector(".loading");
        if (loadingEl) loadingEl.remove();
      }

      function showError(message) {
        document.getElementById("mindmap").innerHTML = `<p class='error'>❌ ${message}</p>`;
      }

      // Allow Enter key to generate
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("pmc").addEventListener("keypress", (e) => {
          if (e.key === "Enter") generateMindmap();
        });
      });

      window.generateMindmap = generateMindmap;
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        margin-bottom: 20px;
      }

      header h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      header p {
        color: #666;
        font-size: 14px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      input, select, button {
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      input {
        flex: 1;
        min-width: 200px;
        background: #f5f5f5;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        background: white;
      }

      select {
        background: white;
        cursor: pointer;
      }

      select:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        white-space: nowrap;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      #mindmap, #research-details {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        padding: 20px;
        overflow-x: auto;
        min-height: 400px;
      }

      #mindmap {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mermaid {
        display: flex;
        justify-content: center;
      }

      #research-details {
        overflow-y: auto;
        max-height: 800px;
      }

      .research-details {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .detail-section {
        border-left: 4px solid #667eea;
        padding-left: 16px;
      }

      .detail-section h3 {
        color: #333;
        margin-bottom: 10px;
        font-size: 16px;
      }

      .detail-section p {
        color: #555;
        line-height: 1.6;
        margin-bottom: 8px;
      }

      .detail-section code {
        background: #f5f5f5;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
        color: #d63384;
      }

      .detail-section ul {
        list-style: none;
        padding: 0;
      }

      .detail-section li {
        color: #555;
        padding: 8px 0;
        line-height: 1.6;
        border-bottom: 1px solid #f0f0f0;
      }

      .detail-section li:last-child {
        border-bottom: none;
      }

      .detail-section li::before {
        content: "→ ";
        color: #667eea;
        font-weight: bold;
        margin-right: 8px;
      }

      .detail-section.highlight {
        background: #f9f5ff;
        border-left-color: #667eea;
        padding: 16px;
        border-radius: 8px;
        margin: 10px 0;
      }

      .detail-section.warning {
        background: #fff5f5;
        border-left-color: #ff6b6b;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        background: #e7e9ff;
        color: #667eea;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
      }

      .loading, .error {
        text-align: center;
        padding: 30px;
        font-size: 16px;
        font-weight: 500;
      }

      .loading {
        color: #667eea;
      }

      .error {
        color: #ff6b6b;
      }

      @media (max-width: 1024px) {
        .main-content {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        header {
          padding: 20px;
        }

        header h1 {
          font-size: 22px;
        }

        .controls {
          flex-direction: column;
        }

        input, select, button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>🧠 NASA Research Mindmap Analyzer</h1>
        <p>Extract and visualize research insights from NASA research articles</p>

        <div class="controls">
          <input 
            id="pmc" 
            type="text"
            placeholder="Enter PMC ID (e.g., PMC12034939)" 
          />
          <select id="mode">
            <option value="overview">📄 Overview Mode</option>
            <option value="research">🔬 Research Mode (Detailed)</option>
          </select>
          <button onclick="generateMindmap()">Generate Mindmap</button>
        </div>
      </header>

      <div class="main-content">
        <div id="mindmap"></div>
        <div id="research-details"></div>
      </div>
    </div>
  </body>
</html>
